services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.3-alpine
    container_name: mastra_clickhouse_dev
    restart: unless-stopped

    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: password

    ports:
      - "8123:8123"
      - "9000:9000"

    volumes:
      - clickhouse_data_dev:/var/lib/clickhouse

    healthcheck:
      test: [ "CMD-SHELL", "clickhouse-client --user default --password password --query 'SELECT 1'" ]
      interval: 5s
      timeout: 5s
      retries: 10
  postgres:
    image: postgres:18
    container_name: postgres_dev
    restart: unless-stopped

    environment:
      POSTGRES_USER: mastra
      POSTGRES_PASSWORD: mastra
      POSTGRES_DB: mastra_dev

    ports:
      - "5432:5432"

    volumes:
      - postgres_data_dev:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mastra -d mastra_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  clickhouse_data_dev:
  postgres_data_dev:
